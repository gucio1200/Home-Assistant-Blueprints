blueprint:
  name: Motion-activated Light with Conditions, Exceptions, Optional Settings, and Sun Offset
  description: >
    Turns light on when motion detected, then off once every sensor has been clear for the
    wait period. Set wait time to 0 to disable automatic turn-off (on-only). Includes Turn On,
    RGB, or Temperature control, conditional entity check, and sun position check.

    If a light is turned off (manually or otherwise) while any sensor still reports
    presence, it is turned back on right away (can be disabled with "Relight When Occupied").

    After a Home Assistant start or an automation reload (which cancels a pending
    turn-off), lights that are still on get the turn-off countdown again, subject to the
    condition entity and sun checks.

    Sun timing: leave Sunrise/Sunset Offset blank to use the shared Sun Offset (existing
    behavior). Set them separately for asymmetric windows — e.g. Night from 30 min before
    sunset until 30 min after sunrise: Sunset Offset -00:30, Sunrise Offset 00:30.
  domain: automation
  source_url: https://github.com/gucio1200/Home-Assistant-Blueprints/blob/main/advanced_motion_automation.yaml
  input:
    motion_sensors:
      name: Motion and Occupancy Sensors
      description: Select one or more motion or occupancy sensors.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true
    entity_target:
      name: Lights and Switches
      description: Select one or more lights or switches to control.
      selector:
        target:
          entity:
            domain:
              - light
              - switch
    no_motion_wait:
      name: Wait Time
      description: Seconds to keep the light on after last motion. Set to 0 to disable automatic turn-off (automation only turns lights on).
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    set_Control:
      name: Mode
      description: Select between a simple Turn On, RGB, or Color Temperature to operate the light(s)
      default: Turn On
      selector:
        select:
          options:
            - Turn On
            - RGB
            - Temperature
          mode: list
    brightness:
      name: Brightness
      description: Set the brightness level (0-255). Required for RGB & Temperature modes.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    color:
      name: Color
      description: Set RGB color (Only used in RGB Mode)
      default: [255, 255, 255]
      selector:
        color_rgb:
    color_temperature:
      name: Color Temperature
      description: Set color temperature (Only used in Temperature Mode)
      default: 4000
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 6500
    condition_entity:
      name: Condition Entity (Optional)
      description: Select an entity to check its state (optional). If no entity is defined, this condition is not evaluated.
      default:
      selector:
        entity:
    condition_states:
      name: Allowed States for Condition Entity
      description: Enter the states that the condition entity should be in (comma-separated). If a Condition Entity is not defined these values are ignored.
      default:
      selector:
        text:
    sun_condition:
      name: Sun Condition (Optional)
      description: >
        When the automation may run relative to the sun. None = always (ignore sun).
        Day = between sunrise and sunset (with offsets). Night = after sunset or before
        sunrise (with offsets).
      default: none
      selector:
        select:
          options:
            - value: none
              label: None
            - value: day
              label: Day
            - value: night
              label: Night
    sun_offset:
      name: Sun Offset (Shared)
      description: >
        Applied to both sunrise and sunset when Sunrise Offset and Sunset Offset are left
        blank. Keeps existing automations working. Format HH:MM (e.g. 00:30 = 30 minutes,
        -01:00 = 1 hour before). Positive = after the event, negative = before.
        Note: 30:00 means 30 hours, not 30 minutes.
      default: "00:00"
      selector:
        text:
    sunrise_offset:
      name: Sunrise Offset (Optional)
      description: >
        Override for sunrise only. Leave blank to use Sun Offset (Shared).
        Positive = after sunrise (e.g. 00:30); negative = before (e.g. -00:30).
        Example — night from 30 min before sunset to 30 min after sunrise: set this to
        00:30 and Sunset Offset to -00:30.
      default: ""
      selector:
        text:
    sunset_offset:
      name: Sunset Offset (Optional)
      description: >
        Override for sunset only. Leave blank to use Sun Offset (Shared).
        Positive = after sunset (e.g. 00:30); negative = before (e.g. -00:30).
        Example — night from 30 min before sunset to 30 min after sunrise: set this to
        -00:30 and Sunrise Offset to 00:30.
      default: ""
      selector:
        text:
    blocking_entity:
      name: Blocking Entity (Optional)
      description: Select an entity that will prevent the automation from running when in specified states.
      default:
      selector:
        entity:
    blocking_states:
      name: Blocking States
      description: Enter the states that will prevent the automation from running (comma-separated).
      default:
      selector:
        text:
    relight_when_occupied:
      name: Relight When Occupied
      description: >
        Turn the lights back on as soon as they are turned off while any sensor still reports
        presence. Only works for entities selected directly (not areas or devices) in
        Lights and Switches.
      default: true
      selector:
        boolean:

mode: restart
max_exceeded: silent

trigger_variables:
  trigger_sensors: !input motion_sensors
  trigger_target: !input entity_target

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion
  - platform: homeassistant
    event: start
    id: resume
  - platform: event
    event_type: automation_reloaded
    id: resume
  - platform: template
    id: relight
    value_template: >
      {% set lights = trigger_target.entity_id | default([]) %}
      {% set lights = [lights] if lights is string else lights %}
      {{ lights | select('is_state', 'off') | list | count > 0
         and trigger_sensors | select('is_state', 'on') | list | count > 0 }}

variables:
  motion_sensors: !input motion_sensors
  relight_when_occupied: !input relight_when_occupied
  set_Control: !input set_Control
  no_motion_wait: !input no_motion_wait
  condition_entity: !input condition_entity
  condition_states: !input condition_states
  sun_condition: !input sun_condition
  sun_offset: !input sun_offset
  sunrise_offset: !input sunrise_offset
  sunset_offset: !input sunset_offset
  blocking_entity: !input blocking_entity
  blocking_states: !input blocking_states
  entity_target: !input entity_target
  target_entities: >
    {% set lights = entity_target.entity_id | default([]) %}
    {{ [lights] if lights is string else lights }}
  # True when a per-event override is present (blank/None => use shared Sun Offset)
  sunrise_offset_set: "{{ (sunrise_offset | default('', true) | string | trim) not in ['', 'None', 'none'] }}"
  sunset_offset_set: "{{ (sunset_offset | default('', true) | string | trim) not in ['', 'None', 'none'] }}"
  use_shared_sun_offset: "{{ not (sunrise_offset_set | bool) and not (sunset_offset_set | bool) }}"

condition:
  - condition: and
    conditions:
      - condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: relight
          - condition: template
            value_template: "{{ relight_when_occupied | bool }}"
      - condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: resume
          - condition: template
            value_template: "{{ target_entities | select('is_state', 'on') | list | count > 0 }}"
      - condition: or
        conditions:
          - condition: trigger
            id: resume
          - condition: template
            value_template: "{{ blocking_entity == None or blocking_entity == '' }}"
          - condition: template
            value_template: >
              {% set blocking_states_list = blocking_states.split(',') | map('trim') | list %}
              {{ states(blocking_entity) not in blocking_states_list }}
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ condition_entity == None or condition_entity == '' }}"
          - condition: template
            value_template: >
              {% set states_list = condition_states.split(',') | map('trim') | list %}
              {{ condition_entity != None and condition_entity != '' and states_list | length > 0 and states(condition_entity) in states_list }}
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ (sun_condition | default('none')) == 'none' }}"
          # Day with shared Sun Offset only (native sun condition — existing deployments)
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ (sun_condition | default('none')) == 'day' and (use_shared_sun_offset | bool) }}"
              - condition: sun
                after: sunrise
                after_offset: !input sun_offset
                before: sunset
                before_offset: !input sun_offset
          # Night with shared Sun Offset only (native sun condition — existing deployments)
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ (sun_condition | default('none')) == 'night' and (use_shared_sun_offset | bool) }}"
              - condition: or
                conditions:
                  - condition: sun
                    after: sunset
                    after_offset: !input sun_offset
                  - condition: sun
                    before: sunrise
                    before_offset: !input sun_offset
          # Day with separate sunrise/sunset offsets (template — avoids invalid empty !input offsets)
          - condition: template
            value_template: >
              {% set mode = sun_condition | default('none') %}
              {% if mode != 'day' or (use_shared_sun_offset | bool) %}
                {{ false }}
              {% else %}
                {% set shared = sun_offset | default('00:00', true) | string | trim %}
                {% set rise_raw = sunrise_offset | default('', true) | string | trim %}
                {% set set_raw = sunset_offset | default('', true) | string | trim %}
                {% set rise_o = rise_raw if rise_raw not in ['', 'None', 'none'] else shared %}
                {% set set_o = set_raw if set_raw not in ['', 'None', 'none'] else shared %}
                {% if rise_o in ['', 'None', 'none'] %}{% set rise_o = '00:00' %}{% endif %}
                {% if set_o in ['', 'None', 'none'] %}{% set set_o = '00:00' %}{% endif %}
                {% set rise_neg = rise_o.startswith('-') %}
                {% set set_neg = set_o.startswith('-') %}
                {% set rise_body = rise_o.lstrip('-') %}
                {% set set_body = set_o.lstrip('-') %}
                {% if rise_body.split(':') | length == 2 %}{% set rise_body = rise_body ~ ':00' %}{% endif %}
                {% if set_body.split(':') | length == 2 %}{% set set_body = set_body ~ ':00' %}{% endif %}
                {% set rise_td = as_timedelta(rise_body) %}
                {% set set_td = as_timedelta(set_body) %}
                {% if rise_neg %}{% set rise_td = -rise_td %}{% endif %}
                {% if set_neg %}{% set set_td = -set_td %}{% endif %}
                {% set next_rise = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                {% set next_set = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                {% set today_rise = next_rise if next_rise.date() == now().date() else next_rise - timedelta(days=1) %}
                {% set today_set = next_set if next_set.date() == now().date() else next_set - timedelta(days=1) %}
                {{ now() >= today_rise + rise_td and now() < today_set + set_td }}
              {% endif %}
          # Night with separate sunrise/sunset offsets
          - condition: template
            value_template: >
              {% set mode = sun_condition | default('none') %}
              {% if mode != 'night' or (use_shared_sun_offset | bool) %}
                {{ false }}
              {% else %}
                {% set shared = sun_offset | default('00:00', true) | string | trim %}
                {% set rise_raw = sunrise_offset | default('', true) | string | trim %}
                {% set set_raw = sunset_offset | default('', true) | string | trim %}
                {% set rise_o = rise_raw if rise_raw not in ['', 'None', 'none'] else shared %}
                {% set set_o = set_raw if set_raw not in ['', 'None', 'none'] else shared %}
                {% if rise_o in ['', 'None', 'none'] %}{% set rise_o = '00:00' %}{% endif %}
                {% if set_o in ['', 'None', 'none'] %}{% set set_o = '00:00' %}{% endif %}
                {% set rise_neg = rise_o.startswith('-') %}
                {% set set_neg = set_o.startswith('-') %}
                {% set rise_body = rise_o.lstrip('-') %}
                {% set set_body = set_o.lstrip('-') %}
                {% if rise_body.split(':') | length == 2 %}{% set rise_body = rise_body ~ ':00' %}{% endif %}
                {% if set_body.split(':') | length == 2 %}{% set set_body = set_body ~ ':00' %}{% endif %}
                {% set rise_td = as_timedelta(rise_body) %}
                {% set set_td = as_timedelta(set_body) %}
                {% if rise_neg %}{% set rise_td = -rise_td %}{% endif %}
                {% if set_neg %}{% set set_td = -set_td %}{% endif %}
                {% set next_rise = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                {% set next_set = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                {% set today_rise = next_rise if next_rise.date() == now().date() else next_rise - timedelta(days=1) %}
                {% set today_set = next_set if next_set.date() == now().date() else next_set - timedelta(days=1) %}
                {{ now() >= today_set + set_td or now() < today_rise + rise_td }}
              {% endif %}
action:
  - if:
      - condition: not
        conditions:
          - condition: trigger
            id: resume
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ set_Control == 'RGB' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ 'light.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: light.turn_on
                        target: !input entity_target
                        data:
                          brightness: !input brightness
                          rgb_color: !input color
                  - conditions:
                      - condition: template
                        value_template: "{{ 'switch.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: switch.turn_on
                        target: !input entity_target
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ set_Control == 'Turn On' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ 'light.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: light.turn_on
                        target: !input entity_target
                        data:
                          brightness: !input brightness
                  - conditions:
                      - condition: template
                        value_template: "{{ 'switch.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: switch.turn_on
                        target: !input entity_target
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ set_Control == 'Temperature' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ 'light.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: light.turn_on
                        target: !input entity_target
                        data:
                          brightness: !input brightness
                          color_temp_kelvin: !input color_temperature
                  - conditions:
                      - condition: template
                        value_template: "{{ 'switch.' in entity_target.entity_id|string }}"
                    sequence:
                      - service: switch.turn_on
                        target: !input entity_target
        default:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ 'light.' in entity_target.entity_id|string }}"
                sequence:
                  - service: light.turn_on
                    target: !input entity_target
                    data:
                      brightness: !input brightness
              - conditions:
                  - condition: template
                    value_template: "{{ 'switch.' in entity_target.entity_id|string }}"
                sequence:
                  - service: switch.turn_on
                    target: !input entity_target
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (no_motion_wait | int(0)) > 0 }}"
        sequence:
          - repeat:
              sequence:
                - wait_template: "{{ motion_sensors | select('is_state', 'on') | list | count == 0 }}"
                - wait_template: "{{ motion_sensors | select('is_state', 'on') | list | count > 0 }}"
                  timeout: "{{ no_motion_wait | int }}"
                  continue_on_timeout: true
              until:
                - "{{ not wait.completed }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ 'light.' in entity_target.entity_id|string }}"
                sequence:
                  - service: light.turn_off
                    target: !input entity_target
              - conditions:
                  - condition: template
                    value_template: "{{ 'switch.' in entity_target.entity_id|string }}"
                sequence:
                  - service: switch.turn_off
                    target: !input entity_target