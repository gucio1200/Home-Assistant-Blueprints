blueprint:
  name: Air Purifier PM2.5 Curve
  description: >
    Drives an air purifier from one or more PM2.5 sensors using an editable curve.

    The sensors are combined (mean, max, median or min, rounded up) and the result is mapped
    to a fan level through the curve points "PM:percent", with linear interpolation between
    points. Below the first point the purifier can go to its auto preset, turn off or stay at
    the first point's level. Above the last point it stays at the last point's level.

    Level control can use the standard fan percentage or a Xiaomi MIoT favorite level
    (xiaomi_miot.set_property), which gives finer steps on purifiers whose percentage has only
    a few speeds. An optional window sensor turns the purifier off while windows are open.
  domain: automation
  source_url: https://github.com/gucio1200/Home-Assistant-Blueprints/blob/main/air_purifier_pm25_curve.yaml
  input:
    pm_sensors:
      name: PM2.5 Sensors
      description: One or more PM2.5 sensors. Unavailable or non-numeric sensors are skipped.
      selector:
        entity:
          domain: sensor
          device_class: pm25
          multiple: true
    aggregation:
      name: Combine Sensors
      description: How to combine the sensor readings before applying the curve (result is rounded up).
      default: mean
      selector:
        select:
          options:
            - value: mean
              label: Mean
            - value: max
              label: Max
            - value: median
              label: Median
            - value: min
              label: Min
    purifier:
      name: Air Purifier
      selector:
        entity:
          domain: fan
    curve:
      name: Curve Points
      description: >
        Comma-separated "PM:percent" points, e.g. "10:15, 44:100" (equals percent = (PM - 4) x 2.5
        from 10 to 44). Points can be in any order; values between points are interpolated
        linearly.
      default: "10:15, 44:100"
      selector:
        text:
    below_curve:
      name: Below The First Point
      default: auto
      selector:
        select:
          options:
            - value: auto
              label: Auto preset
            - value: "off"
              label: Turn off
            - value: lowest
              label: Keep the first point's level
    auto_preset:
      name: Auto Preset Name
      description: Preset used for "Auto preset" below the curve (as listed in the fan's preset_modes).
      default: Auto
      selector:
        text:
    control_method:
      name: Level Control
      default: percentage
      selector:
        select:
          options:
            - value: percentage
              label: Fan percentage (fan.set_percentage)
            - value: xiaomi_miot
              label: Xiaomi MIoT favorite level (xiaomi_miot.set_property)
    manual_preset:
      name: Manual Preset Name (Xiaomi MIoT)
      description: Preset selected before setting the favorite level. Leave empty to skip.
      default: Manual
      selector:
        text:
    favorite_level_field:
      name: Favorite Level Property (Xiaomi MIoT)
      description: Property set by xiaomi_miot.set_property and read back from the fan's attributes.
      default: custom_service.favorite_level
      selector:
        text:
    max_level:
      name: Max Favorite Level (Xiaomi MIoT)
      description: The favorite level that corresponds to 100 percent.
      default: 11
      selector:
        number:
          min: 1
          max: 100
          mode: box
    window_sensor:
      name: Window Sensor (Optional)
      description: The purifier is turned off while this sensor is on.
      default:
      selector:
        entity:
          domain: binary_sensor
    window_enable:
      name: Window Dependency Switch (Optional)
      description: When set, the window sensor is only honoured while this entity is on.
      default:
      selector:
        entity:
          domain:
            - input_boolean
            - switch
            - binary_sensor

mode: restart
max_exceeded: silent

trigger_variables:
  window_sensor: !input window_sensor
  window_enable: !input window_enable

trigger:
  - platform: state
    entity_id: !input pm_sensors
  - platform: template
    id: window
    value_template: >
      {{ window_sensor not in [none, '']
         and is_state(window_sensor, 'on')
         and (window_enable in [none, ''] or is_state(window_enable, 'on')) }}
  - platform: template
    id: window
    value_template: >
      {{ not (window_sensor not in [none, '']
              and is_state(window_sensor, 'on')
              and (window_enable in [none, ''] or is_state(window_enable, 'on'))) }}

variables:
  pm_sensors: !input pm_sensors
  aggregation: !input aggregation
  purifier: !input purifier
  curve: !input curve
  below_curve: !input below_curve
  auto_preset: !input auto_preset
  control_method: !input control_method
  manual_preset: !input manual_preset
  favorite_level_field: !input favorite_level_field
  max_level: !input max_level
  window_sensor: !input window_sensor
  window_enable: !input window_enable
  windows_block: >
    {{ window_sensor not in [none, '']
       and is_state(window_sensor, 'on')
       and (window_enable in [none, ''] or is_state(window_enable, 'on')) }}
  readings: >
    {{ pm_sensors | map('states') | select('is_number') | map('float') | list }}
  pm: >
    {% set r = readings | sort %}
    {% if r | count == 0 %}none
    {% elif aggregation == 'max' %}{{ r | max | round(0, 'ceil') | int }}
    {% elif aggregation == 'min' %}{{ r | min | round(0, 'ceil') | int }}
    {% elif aggregation == 'median' %}
      {% set n = r | count %}
      {{ (((r[(n - 1) // 2] + r[n // 2]) / 2)) | round(0, 'ceil') | int }}
    {% else %}{{ (r | sum / r | count) | round(0, 'ceil') | int }}
    {% endif %}
  points: >
    {% set ns = namespace(pts=[]) %}
    {% for p in (curve or '').split(',') %}
      {% set kv = p.split(':') %}
      {% if kv | count == 2 and is_number(kv[0] | trim) and is_number(kv[1] | trim) %}
        {% set ns.pts = ns.pts + [[kv[0] | trim | float, [[kv[1] | trim | float, 0] | max, 100] | min]] %}
      {% endif %}
    {% endfor %}
    {{ ns.pts | sort(attribute='0') }}
  target: >
    {% if pm in [none, 'none'] or points | count == 0 %}skip
    {% elif pm < points[0][0] %}
      {{ points[0][1] if below_curve == 'lowest' else 'below' }}
    {% elif pm >= points[-1][0] %}{{ points[-1][1] }}
    {% else %}
      {% set r = namespace(v=none) %}
      {% for i in range(points | count - 1) %}
        {% if r.v is none and points[i][0] <= pm < points[i + 1][0] %}
          {% set r.v = points[i][1] + (pm - points[i][0]) * (points[i + 1][1] - points[i][1]) / (points[i + 1][0] - points[i][0]) %}
        {% endif %}
      {% endfor %}
      {{ r.v | round(1) }}
    {% endif %}
  favorite_level: >
    {% if is_number(target) %}{{ [[(target | float / 100 * max_level | float) | round(0) | int, 1] | max, max_level | int] | min }}{% else %}0{% endif %}

condition: []

action:
  - if:
      - condition: template
        value_template: "{{ windows_block }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not is_state(purifier, 'off') }}"
        then:
          - service: fan.turn_off
            target:
              entity_id: "{{ purifier }}"
      - stop: Windows open
  - if:
      - condition: template
        value_template: "{{ target == 'skip' }}"
    then:
      - stop: No valid PM2.5 reading or curve
  - if:
      - condition: template
        value_template: "{{ target == 'below' and below_curve == 'off' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not is_state(purifier, 'off') }}"
        then:
          - service: fan.turn_off
            target:
              entity_id: "{{ purifier }}"
      - stop: Below the curve, purifier off
  - if:
      - condition: template
        value_template: "{{ is_state(purifier, 'off') }}"
    then:
      - service: fan.turn_on
        target:
          entity_id: "{{ purifier }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ target == 'below' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(purifier, 'preset_mode') != auto_preset }}"
            then:
              - service: fan.set_preset_mode
                target:
                  entity_id: "{{ purifier }}"
                data:
                  preset_mode: "{{ auto_preset }}"
      - conditions:
          - condition: template
            value_template: "{{ control_method == 'xiaomi_miot' }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ manual_preset not in [none, '']
                     and state_attr(purifier, 'preset_mode') != manual_preset }}
            then:
              - service: fan.set_preset_mode
                target:
                  entity_id: "{{ purifier }}"
                data:
                  preset_mode: "{{ manual_preset }}"
          - if:
              - condition: template
                value_template: "{{ state_attr(purifier, favorite_level_field) | int(-1) != favorite_level | int }}"
            then:
              - service: xiaomi_miot.set_property
                target:
                  entity_id: "{{ purifier }}"
                data:
                  field: "{{ favorite_level_field }}"
                  value: "{{ favorite_level | int }}"
    default:
      - if:
          - condition: template
            value_template: "{{ state_attr(purifier, 'percentage') | int(-1) != target | float | round(0) | int }}"
        then:
          - service: fan.set_percentage
            target:
              entity_id: "{{ purifier }}"
            data:
              percentage: "{{ target | float | round(0) | int }}"
